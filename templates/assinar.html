<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assinar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#0f172a;color:#e2e8f0}</style>
</head>
<body class="py-5">
  <div class="container" style="max-width:520px">
    <div class="card bg-dark border-secondary p-4 text-center">
      <h1 class="h4">Seu período de teste acabou</h1>
      {% if empresa %}
      <p class="text-secondary">Oficina: <strong>{{ empresa.nome_fantasia }}</strong><br>
      Venceu em: {{ empresa.data_vencimento }}</p>
      {% endif %}
      <p>Assine para continuar usando o sistema.</p>
      <p class="small text-secondary">Pagamento automático entra no próximo passo (Mercado Pago).</p>
      <a href="/logout" class="btn btn-outline-light">Sair</a>
    </div>
  </div>
</body>
</html>
