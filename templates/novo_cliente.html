{% extends "base.html" %}

{% block title %}
{% if cliente %}
Editar Cliente
{% else %}
Novo Cliente
{% endif %}
{% endblock %}

{% block conteudo %}

<div class="container-fluid">

    <h2 class="mb-4 text-white">

        {% if cliente %}
            Editar Cliente
        {% else %}
            Novo Cliente
        {% endif %}

    </h2>

    <div class="card-dashboard">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Nome</label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        required
                        value="{{ cliente.nome if cliente else '' }}"
                    >

                </div>

                <div class="col-md-3 mb-3">
                    <label>CPF/CNPJ</label>

                    <input
                        type="text"
                        name="cpf_cnpj"
                        class="form-control"
                        value="{{ cliente.cpf_cnpj if cliente else '' }}"
                    >

                </div>

                <div class="col-md-3 mb-3">
                    <label>Telefone</label>

                    <input
                        type="text"
                        name="telefone"
                        class="form-control"
                        value="{{ cliente.telefone if cliente else '' }}"
                    >

                </div>

                <div class="col-md-3 mb-3">
                    <label>WhatsApp</label>

                    <input
                        type="text"
                        name="whatsapp"
                        class="form-control"
                        value="{{ cliente.whatsapp if cliente else '' }}"
                    >

                </div>

                <div class="col-md-3 mb-3">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ cliente.email if cliente else '' }}"
                    >

                </div>

                <div class="col-md-6 mb-3">
                    <label>Endereço</label>

                    <input
                        type="text"
                        name="endereco"
                        class="form-control"
                        value="{{ cliente.endereco if cliente else '' }}"
                    >

                </div>

                <div class="col-md-3 mb-3">
                    <label>Cidade</label>

                    <input
                        type="text"
                        name="cidade"
                        class="form-control"
                        value="{{ cliente.cidade if cliente else '' }}"
                    >

                </div>

                <div class="col-md-3 mb-3">
                    <label>Estado</label>

                    <input
                        type="text"
                        name="estado"
                        class="form-control"
                        value="{{ cliente.estado if cliente else '' }}"
                    >

                </div>

                <div class="col-12 mb-3">

                    <label>Observações</label>

                    <textarea
                        name="observacoes"
                        class="form-control"
                        rows="5"
                    >{{ cliente.observacoes if cliente else '' }}</textarea>

                </div>

            </div>

            <button class="btn btn-success">

                {% if cliente %}
                    Atualizar Cliente
                {% else %}
                    Salvar Cliente
                {% endif %}

            </button>

            <a href="/clientes" class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
