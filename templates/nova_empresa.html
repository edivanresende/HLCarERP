{% extends "base.html" %}

{% block title %}Nova Empresa{% endblock %}

{% block conteudo %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-white mb-0">Cadastrar Nova Empresa</h2>
        <a href="/empresas" class="btn btn-secondary">Voltar</a>
    </div>

    {% if erro %}
    <div class="alert alert-danger">{{ erro }}</div>
    {% endif %}

    <div class="card bg-dark border-0">
        <div class="card-body">
            <form method="POST">
                <h5 class="text-warning mb-3">Dados da Empresa</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-white">Nome Fantasia *</label>
                        <input type="text" name="nome_fantasia" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white">Razão Social *</label>
                        <input type="text" name="razao_social" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">CNPJ</label>
                        <input type="text" name="cnpj" class="form-control bg-dark text-white border-secondary">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">Telefone</label>
                        <input type="text" name="telefone" class="form-control bg-dark text-white border-secondary">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">WhatsApp</label>
                        <input type="text" name="whatsapp" class="form-control bg-dark text-white border-secondary">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white">E-mail</label>
                        <input type="email" name="email" class="form-control bg-dark text-white border-secondary">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">Cidade</label>
                        <input type="text" name="cidade" class="form-control bg-dark text-white border-secondary">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-white">Estado</label>
                        <input type="text" name="estado" class="form-control bg-dark text-white border-secondary" maxlength="2">
                    </div>
                </div>

                <h5 class="text-warning mb-3">Primeiro Usuário (Admin da nova empresa)</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label text-white">Nome do Admin *</label>
                        <input type="text" name="nome_admin" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">Login *</label>
                        <input type="text" name="login_admin" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">Senha *</label>
                        <input type="password" name="senha_admin" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-warning btn-lg">Cadastrar Empresa</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
