{% extends "base.html" %}
{% block title %}{{ 'Editar' if mecanico else 'Novo' }} Mecânico{% endblock %}
{% block conteudo %}
<div class="container-fluid">
    <h2 class="text-white mb-4">
        <i class="fa fa-user-cog"></i>
        {{ 'Editar' if mecanico else 'Novo' }} Mecânico
    </h2>
    <div class="card-dashboard">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-secondary">Nome *</label>
                    <input type="text" name="nome" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.nome if mecanico else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary">Telefone</label>
                    <input type="text" name="telefone" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.telefone if mecanico else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary">WhatsApp</label>
                    <input type="text" name="whatsapp" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.whatsapp if mecanico else '' }}">
                </div>

                <div class="col-md-4">
                    <label class="form-label text-secondary">Tipo *</label>
                    <select name="tipo" class="form-select bg-dark text-white border-secondary" required>
                        <option value="FUNCIONARIO" {% if not mecanico or mecanico.tipo == 'FUNCIONARIO' %}selected{% endif %}>
                            Funcionário (salário + comissão padrão)
                        </option>
                        <option value="PARCEIRO" {% if mecanico and mecanico.tipo == 'PARCEIRO' %}selected{% endif %}>
                            Parceiro (comissão negociada por serviço)
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <select name="tipo_remuneracao" class="form-select bg-dark text-white border-secondary">
    <option value="COMISSAO" {% if mecanico and mecanico.tipo_remuneracao == 'COMISSAO' %}selected{% endif %}>Só comissão</option>
    <option value="SALARIO" {% if mecanico and mecanico.tipo_remuneracao == 'SALARIO' %}selected{% endif %}>Só salário</option>
    <option value="MISTO" {% if mecanico and mecanico.tipo_remuneracao == 'MISTO' %}selected{% endif %}>Salário + comissão</option>
    <option value="PARCEIRO" {% if mecanico and mecanico.tipo_remuneracao == 'PARCEIRO' %}selected{% endif %}>Parceiro (negociado)</option>
</select>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-secondary">Salário (R$)</label>
                    <input type="number" step="0.01" name="salario" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.salario if mecanico else 0 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-secondary">Comissão padrão (%)</label>
                    <input type="number" step="0.01" name="percentual_comissao" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.percentual_comissao if mecanico else 20 }}">
                    <small class="text-secondary">Para parceiros, a % pode ser alterada em cada OS</small>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary">Entrada (hora)</label>
                    <input type="number" min="6" max="12" name="hora_entrada" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.hora_entrada if mecanico else 9 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary">Saída (hora)</label>
                    <input type="number" min="14" max="22" name="hora_saida" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.hora_saida if mecanico else 18 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary">Almoço início</label>
                    <input type="number" min="11" max="14" name="almoco_inicio" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.almoco_inicio if mecanico else 12 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary">Almoço fim</label>
                    <input type="number" min="12" max="15" name="almoco_fim" class="form-control bg-dark text-white border-secondary"
                           value="{{ mecanico.almoco_fim if mecanico else 14 }}">
                </div>
                <div class="col-md-12">
                    <label class="form-label text-secondary">Observações</label>
                    <textarea name="observacoes" rows="2" class="form-control bg-dark text-white border-secondary">{{ mecanico.observacoes if mecanico else '' }}</textarea>
                </div>
                <div class="col-md-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="ativo" id="ativo"
                               {% if not mecanico or mecanico.ativo %}checked{% endif %}>
                        <label class="form-check-label text-secondary" for="ativo">Mecânico ativo</label>
                    </div>
                </div>
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-warning">Salvar</button>
                    <a href="/mecanicos" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
