<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}HLCarERP{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
background:#111827;
overflow-x:hidden;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100vh;
background:#0f172a;
border-right:1px solid #222;
padding-top:20px;
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#ff6b00;
margin-bottom:30px;
}

.menu{
list-style:none;
padding:0;
}

.menu li{
margin-bottom:5px;
}

.menu a{
display:block;
padding:15px 25px;
text-decoration:none;
color:#d6d6d6;
font-size:16px;
transition:.3s;
}

.menu a:hover{
background:#ff6b00;
color:white;
}

.topbar{
position:fixed;
left:250px;
top:0;
right:0;
height:70px;
background:#1f2937;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
border-bottom:1px solid #333;
z-index:1000;
}

.topbar h3{
color:white;
margin:0;
}

.usuario{
color:#fff;
}

.content{
margin-left:250px;
margin-top:70px;
padding:30px;
min-height:calc(100vh - 70px);
}

.card-dashboard{
background:#1f2937;
border-radius:15px;
padding:20px;
color:white;
box-shadow:0 0 15px rgba(0,0,0,.35);
transition:.3s;
}

.card-dashboard:hover{
transform:translateY(-5px);
}

.numero{
font-size:34px;
font-weight:bold;
margin-top:10px;
color:#ff6b00;
}

</style>

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#111827">
<link rel="stylesheet" href="{{ url_for('static', filename='css/offline.css') }}">

</head>

<body>

<div class="sidebar">

<div class="logo">
HLCarERP
</div>

<ul class="menu">

<li><a href="/"><i class="fa fa-chart-line"></i> Dashboard</a></li>

<li><a href="/clientes"><i class="fa fa-users"></i> Clientes</a></li>

<li><a href="/veiculos"><i class="fa fa-car"></i> Veículos</a></li>

<li><a href="/ordens"><i class="fa fa-file-alt"></i> Ordem de Serviço</a></li>

<li>
    <a href="/estoque">
        <i class="fa fa-box"></i>
        Estoque
    </a>
</li>

<li>
    <a href="/financeiro">
        <i class="fa fa-dollar-sign"></i>
        Financeiro
    </a>
</li>

<li>
    <a href="/usuarios">
        <i class="fa fa-user-cog"></i>
        Usuários
    </a>
</li>

<li>
    <a href="/mecanicos">
        <i class="fa fa-wrench"></i>
        Mecânicos
    </a>
</li>

<li>
    <a href="/configuracoes">
        <i class="fa fa-cog"></i>
        Configurações
    </a>
</li>

</ul>

</div>

<div class="topbar">

<h3>HL Car Auto Center</h3>

<div class="usuario">
Administrador
</div>

</div>

<div class="content">

{% block conteudo %}
{% endblock %}

</div>

<!-- Indicador Online/Offline -->
<div id="hl-offline-badge" class="hl-badge online">
    <i class="fa fa-check-circle"></i> Online
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/offline-db.js') }}"></script>
<script src="{{ url_for('static', filename='js/offline-queue.js') }}"></script>
<script src="{{ url_for('static', filename='js/offline-sync.js') }}"></script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('/static/service-worker.js')
            .then(function (reg) {
                console.log('Service Worker registrado.');
                if ('sync' in reg) {
                    reg.sync.register('hlcarerp-sync').catch(function () {});
                }
            })
            .catch(function (err) {
                console.log('Erro SW:', err);
            });
    });
    navigator.serviceWorker.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'SYNC_NOW' && window.HLOfflineSync) {
            window.HLOfflineSync.sincronizarTudo();
        }
    });
}
</script>

</body>

</html>
