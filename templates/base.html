<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HLCarERP{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
background:#111827;
overflow-x:hidden;
}

/* ========== SIDEBAR ========== */
.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100vh;
background:#0f172a;
border-right:1px solid #222;
padding-top:20px;
z-index:1050;
transition: transform 0.3s ease;
}

.logo{
text-align:center;
font-size:26px;
font-weight:bold;
color:#ff6b00;
margin-bottom:30px;
}

.menu{
list-style:none;
padding:0;
}

.menu li{
margin-bottom:4px;
}

.menu a{
display:block;
padding:14px 25px;
text-decoration:none;
color:#d6d6d6;
font-size:15px;
transition:.25s;
}

.menu a:hover,
.menu a.active{
background:#ff6b00;
color:white;
}

/* ========== TOPBAR ========== */
.topbar{
position:fixed;
left:250px;
top:0;
right:0;
height:60px;
background:#1f2937;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid #333;
z-index:1000;
transition: left 0.3s ease;
}

.topbar h3{
color:white;
margin:0;
font-size:1.15rem;
}

.usuario{
color:#fff;
display:flex;
align-items:center;
gap:10px;
}

/* ========== CONTENT ========== */
.content{
margin-left:250px;
margin-top:60px;
padding:20px;
min-height:calc(100vh - 60px);
transition: margin-left 0.3s ease;
}

.card-dashboard{
background:#1f2937;
border-radius:15px;
padding:20px;
color:white;
box-shadow:0 0 15px rgba(0,0,0,.35);
transition:.3s;
}

.card-dashboard:hover{
transform:translateY(-4px);
}

.numero{
font-size:32px;
font-weight:bold;
margin-top:8px;
color:#ff6b00;
}

/* ========== BOTÃO HAMBURGUER ========== */
.btn-menu{
display:none;
background:transparent;
border:none;
color:white;
font-size:1.4rem;
padding:6px 10px;
}

/* ========== OVERLAY (fundo escuro no mobile) ========== */
.sidebar-overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:1040;
}

/* ========== TABELAS RESPONSIVAS ========== */
.table-responsive{
overflow-x:auto;
-webkit-overflow-scrolling:touch;
}

.table-dark th,
.table-dark td{
white-space:nowrap;
}

/* ========== MOBILE ========== */
@media (max-width: 991.98px) {

.btn-menu{
display:inline-block;
}

.sidebar{
transform: translateX(-100%);
}

.sidebar.show{
transform: translateX(0);
}

.sidebar-overlay.show{
display:block;
}

.topbar{
left:0;
}

.content{
margin-left:0;
padding:15px;
}

.topbar h3{
font-size:1rem;
}
}

@media (max-width: 575.98px) {
.usuario span{
display:none;
}
}
</style>

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#111827">
<link rel="stylesheet" href="{{ url_for('static', filename='css/offline.css') }}">

</head>

<body>

<!-- Overlay para fechar o menu no mobile -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<div class="logo" style="text-align:center; padding: 10px 0 20px;">
    <img src="{{ url_for('static', filename='icons/icon-192.png') }}"
         alt="HL Car"
         style="width:64px; height:64px; border-radius:12px;">
    <div style="color:#ff6b00; font-weight:bold; font-size:18px; margin-top:8px;">
        HLCarERP
    </div>
</div>

    <ul class="menu">
        <li><a href="/"><i class="fa fa-chart-line me-2"></i> Dashboard</a></li>
        <li><a href="/clientes"><i class="fa fa-users me-2"></i> Clientes</a></li>
        <li><a href="/veiculos"><i class="fa fa-car me-2"></i> Veículos</a></li>
        <li><a href="/ordens"><i class="fa fa-file-alt me-2"></i> Ordem de Serviço</a></li>
        <li><a href="/estoque"><i class="fa fa-box me-2"></i> Estoque</a></li>
        <li><a href="/financeiro"><i class="fa fa-dollar-sign me-2"></i> Financeiro</a></li>
        <li><a href="/usuarios"><i class="fa fa-user-cog me-2"></i> Usuários</a></li>
        <li><a href="/mecanicos"><i class="fa fa-wrench me-2"></i> Mecânicos</a></li>
        <li><a href="/configuracoes"><i class="fa fa-cog me-2"></i> Configurações</a></li>
    </ul>
</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="d-flex align-items-center gap-2">
        <button class="btn-menu" id="btnMenu" aria-label="Menu">
            <i class="fa fa-bars"></i>
        </button>
        <h3>HL Car Auto Center</h3>
    </div>

    <div class="usuario">
        <span>{{ session.get('usuario_nome', 'Usuário') }}</span>
        <a href="/logout" class="btn btn-sm btn-outline-danger">
            <i class="fa fa-sign-out-alt"></i> Sair
        </a>
    </div>
</div>

<!-- CONTEÚDO -->
<div class="content">
    {% block conteudo %}
    {% endblock %}
</div>

<!-- Indicador Online/Offline -->
<div id="hl-offline-badge" class="hl-badge online">
    <i class="fa fa-check-circle"></i> Online
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/offline-db.js') }}"></script>
<script src="{{ url_for('static', filename='js/offline-queue.js') }}"></script>
<script src="{{ url_for('static', filename='js/offline-sync.js') }}"></script>

<script>
// Menu hambúrguer
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebarOverlay');
const btnMenu = document.getElementById('btnMenu');

btnMenu.addEventListener('click', function () {
    sidebar.classList.toggle('show');
    overlay.classList.toggle('show');
});

overlay.addEventListener('click', function () {
    sidebar.classList.remove('show');
    overlay.classList.remove('show');
});

// Fecha o menu ao clicar em um link (mobile)
document.querySelectorAll('.menu a').forEach(function (link) {
    link.addEventListener('click', function () {
        if (window.innerWidth < 992) {
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        }
    });
});
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('/static/service-worker.js')
            .then(function (reg) {
                console.log('Service Worker registrado.');
                if ('sync' in reg) {
                    reg.sync.register('hlcarerp-sync').catch(function () {});
                }
            })
            .catch(function (err) {
                console.log('Erro SW:', err);
            });
    });
    navigator.serviceWorker.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'SYNC_NOW' && window.HLOfflineSync) {
            window.HLOfflineSync.sincronizarTudo();
        }
    });
}
</script>

</body>
</html>
