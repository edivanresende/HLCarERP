{% extends "base.html" %}

{% block title %}Editar Produto{% endblock %}

{% block conteudo %}
<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-white">
                <i class="fa fa-pen"></i> Editar Produto
            </h2>
        </div>
        <a href="/estoque" class="btn btn-secondary">
            <i class="fa fa-arrow-left"></i> Voltar
        </a>
    </div>

    <form method="POST">
        <div class="card-dashboard mb-4">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="text-secondary">Código</label>
                    <input type="text" name="codigo" class="form-control bg-dark text-white border-secondary"
                           value="{{ produto.codigo or '' }}">
                </div>
                <div class="col-md-9">
                    <label class="text-secondary">Descrição</label>
                    <input type="text" name="descricao" class="form-control bg-dark text-white border-secondary"
                           value="{{ produto.descricao or '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="text-secondary">Unidade</label>
                    <select name="unidade" class="form-select bg-dark text-white border-secondary">
                        {% for u in ['UN','PC','CX','LT','KG'] %}
                        <option value="{{ u }}" {% if produto.unidade == u %}selected{% endif %}>{{ u }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="text-secondary">Categoria</label>
                    <select name="categoria_id" class="form-select bg-dark text-white border-secondary">
                        {% for c in categorias %}
                        <option value="{{ c.id }}" {% if produto.categoria_id == c.id %}selected{% endif %}>
                            {{ c.nome }}
                        </option>
                        {% else %}
                        <option value="1" selected>Geral</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="text-secondary">Estoque Atual</label>
                    <input type="number" step="0.001" name="estoque_atual"
                           class="form-control bg-dark text-white border-secondary"
                           value="{{ produto.estoque_atual or 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="text-secondary">Estoque Mínimo</label>
                    <input type="number" step="0.001" name="estoque_minimo"
                           class="form-control bg-dark text-white border-secondary"
                           value="{{ produto.estoque_minimo or 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="text-secondary">Preço Compra</label>
                    <input type="number" step="0.01" name="preco_compra"
                           class="form-control bg-dark text-white border-secondary"
                           value="{{ produto.preco_compra or 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="text-secondary">Preço Venda</label>
                    <input type="number" step="0.01" name="preco_venda"
                           class="form-control bg-dark text-white border-secondary"
                           value="{{ produto.preco_venda or 0 }}">
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-success">
            <i class="fa fa-save"></i> Salvar
        </button>
        <a href="/estoque" class="btn btn-secondary">Cancelar</a>
    </form>

</div>
{% endblock %}
