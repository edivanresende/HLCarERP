<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste grátis 7 dias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0f172a; color:#e2e8f0; }
    .card-t { background:#1e293b; border:1px solid #334155; }
    .card-t label { color:#f8fafc; font-weight:600; margin-bottom:4px; }
    .card-t .form-control { background:#0f172a; color:#fff; border-color:#475569; }
    .card-t .form-control::placeholder { color:#94a3b8; }
  </style>
</head>
<body class="py-5">
  <div class="container" style="max-width:640px">
    <div class="text-center mb-4">
      <div class="badge bg-warning text-dark mb-2">TESTE GRATUITO · 7 DIAS</div>
      <h1 class="h3 text-white">Cadastre sua oficina</h1>
      <p class="text-secondary">Sem cartão. Cancele quando quiser.</p>
    </div>
    <div class="card card-t p-4">
      {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}
      <form method="POST">
        <div class="mb-3">
          <label>Nome da oficina</label>
          <input class="form-control" name="nome_oficina" placeholder="Ex: Oficina do João" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>CNPJ / CPF</label>
            <input class="form-control" name="cnpj" placeholder="00.000.000/0001-00">
          </div>
          <div class="col-md-6 mb-3">
            <label>Celular</label>
            <input class="form-control" name="celular" placeholder="(11) 99999-9999">
          </div>
        </div>
        <div class="mb-3">
          <label>Seu nome</label>
          <input class="form-control" name="nome" placeholder="Nome completo">
        </div>
        <div class="mb-3">
          <label>E-mail</label>
          <input class="form-control" type="email" name="email" placeholder="email@oficina.com">
        </div>
        <div class="mb-3">
          <label>Usuário de acesso</label>
          <input class="form-control" name="usuario" placeholder="ex: joao" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Senha (mínimo 6)</label>
            <input class="form-control" type="password" name="senha" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Repetir senha</label>
            <input class="form-control" type="password" name="senha2" required>
          </div>
        </div>
        <button class="btn btn-warning w-100 fw-bold">Criar minha conta grátis</button>
      </form>
      <p class="text-center mt-3 mb-0"><a href="/login" class="text-secondary">Já tenho conta</a></p>
    </div>
  </div>
</body>
</html>
