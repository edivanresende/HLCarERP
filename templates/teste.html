<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste grátis 7 dias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #fff; color: #0f172a; }
    .split { min-height: 100vh; }
    .left { padding: 40px 36px; }
    .right {
      background: linear-gradient(160deg, #7c2d12 0%, #ea580c 55%, #f59e0b 100%);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 48px 24px;
    }
    .logo { width: 140px; height: 140px; border-radius: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    .badge-t { background: #ede9fe; color: #5b21b6; font-weight: 700; }
    label { font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
    .btn-entrar {
      background: transparent; color: #fff; border: 1px solid #fff;
      border-radius: 999px; padding: 10px 36px;
    }
    .btn-entrar:hover { background: #fff; color: #9a3412; }
    @media (max-width: 991px) {
      .right { min-height: 320px; }
    }
  </style>
</head>
<body>
  <div class="container-fluid p-0">
    <div class="row g-0 split">
      <div class="col-lg-6 left">
        <div class="mx-auto" style="max-width:560px">
          <div class="text-center mb-4">
            <span class="badge badge-t rounded-pill px-3 py-2">TESTE GRATUITO · 7 DIAS</span>
            <h1 class="h3 fw-bold mt-3 mb-1">Cadastre sua oficina</h1>
            <p class="text-secondary mb-0">Sem cartão. Cancele quando quiser.</p>
          </div>
          {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}
          <form method="POST">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Nome da oficina</label>
                <input class="form-control" name="nome_oficina" required>
              </div>
              <div class="col-md-6 mb-3">
                <label>CNPJ / CPF</label>
                <input class="form-control" name="cnpj">
              </div>
              <div class="col-md-6 mb-3">
                <label>Celular</label>
                <input class="form-control" name="celular" placeholder="(11) 99999-9999">
              </div>
              <div class="col-md-6 mb-3">
                <label>Usuário de acesso</label>
                <input class="form-control" name="usuario" required>
              </div>
              <div class="col-md-6 mb-3">
                <label>Senha</label>
                <input class="form-control" type="password" name="senha" placeholder="Mínimo 6 caracteres" required>
              </div>
              <div class="col-md-6 mb-3">
                <label>Repetir senha</label>
                <input class="form-control" type="password" name="senha2" required>
              </div>
            </div>
            <div class="mb-3">
              <label>E-mail</label>
              <input class="form-control" type="email" name="email">
            </div>
            <div class="mb-3">
              <label>Seu nome</label>
              <input class="form-control" name="nome" placeholder="Nome completo">
            </div>
            <button class="btn btn-secondary w-100 py-2">Criar minha conta grátis</button>
          </form>
        </div>
      </div>
      <div class="col-lg-6 right">
        <div>
          <img class="logo mb-4" src="{{ url_for('static', filename='icons/icon-512.png') }}" alt="HLCarERP">
          <h2 class="fw-bold">Bem-vindo<br>de volta!</h2>
          <p class="mb-4 opacity-75">Já tem uma conta?<br>Faça login para continuar.</p>
          <a class="btn btn-entrar" href="/login">Entrar</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
