{% extends "base.html" %}

{% block title %}Editar Empresa{% endblock %}

{% block conteudo %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-white mb-0">Editar Empresa</h2>
        <a href="/empresas" class="btn btn-secondary">Voltar</a>
    </div>

    <div class="card bg-dark border-0">
        <div class="card-body">
            <form method="POST">
                <h5 class="text-warning mb-3">Dados da Empresa</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-white">Nome Fantasia *</label>
                        <input type="text" name="nome_fantasia" class="form-control bg-dark text-white border-secondary" value="{{ empresa.nome_fantasia or '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white">Razão Social *</label>
                        <input type="text" name="razao_social" class="form-control bg-dark text-white border-secondary" value="{{ empresa.razao_social or '' }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">CNPJ</label>
                        <input type="text" name="cnpj" class="form-control bg-dark text-white border-secondary" value="{{ empresa.cnpj or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">Telefone</label>
                        <input type="text" name="telefone" class="form-control bg-dark text-white border-secondary" value="{{ empresa.telefone or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">WhatsApp</label>
                        <input type="text" name="whatsapp" class="form-control bg-dark text-white border-secondary" value="{{ empresa.whatsapp or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white">E-mail</label>
                        <input type="email" name="email" class="form-control bg-dark text-white border-secondary" value="{{ empresa.email or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white">Cidade</label>
                        <input type="text" name="cidade" class="form-control bg-dark text-white border-secondary" value="{{ empresa.cidade or '' }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-white">Estado</label>
                        <input type="text" name="estado" class="form-control bg-dark text-white border-secondary" value="{{ empresa.estado or '' }}" maxlength="2">
                    </div>
                </div>

                <h5 class="text-warning mb-3">Controle de Plano e Pagamento</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label class="form-label text-white">Plano</label>
                        <select name="plano" class="form-select bg-dark text-white border-secondary">
                            <option value="BASICO" {% if empresa.plano == 'BASICO' %}selected{% endif %}>Básico</option>
                            <option value="PRO" {% if empresa.plano == 'PRO' %}selected{% endif %}>Pro</option>
                            <option value="ILIMITADO" {% if empresa.plano == 'ILIMITADO' %}selected{% endif %}>Ilimitado</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-white">Status Pagamento</label>
                        <select name="status_pagamento" class="form-select bg-dark text-white border-secondary">
                            <option value="ATIVO" {% if empresa.status_pagamento == 'ATIVO' %}selected{% endif %}>Ativo</option>
                            <option value="BLOQUEADO" {% if empresa.status_pagamento == 'BLOQUEADO' %}selected{% endif %}>Bloqueado (atraso)</option>
                            <option value="INATIVO" {% if empresa.status_pagamento == 'INATIVO' %}selected{% endif %}>Inativo</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-white">Data Vencimento</label>
                        <input type="date" name="data_vencimento" class="form-control bg-dark text-white border-secondary" value="{{ empresa.data_vencimento.strftime('%Y-%m-%d') if empresa.data_vencimento else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-white">Ativo no sistema</label><br>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" name="ativo" {% if empresa.ativo %}checked{% endif %}>
                            <label class="form-check-label text-white">Empresa ativa</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-white">Observações Internas (só você vê)</label>
                        <textarea name="observacoes_internas" class="form-control bg-dark text-white border-secondary" rows="3">{{ empresa.observacoes_internas or '' }}</textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-warning btn-lg">Salvar Alterações</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
