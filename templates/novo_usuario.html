{% extends "base.html" %}

{% block title %}{{ 'Editar' if usuario else 'Novo' }} Usuário{% endblock %}

{% block conteudo %}
<div class="container-fluid">
    <h2 class="text-white mb-4">
        <i class="fa fa-user"></i> {{ 'Editar' if usuario else 'Novo' }} Usuário
    </h2>

    <div class="card bg-dark shadow border-0" style="max-width: 600px;">
        <div class="card-body">
            {% if erro %}
            <div class="alert alert-danger">{{ erro }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary">Nome</label>
                    <input type="text" name="nome" class="form-control bg-dark text-white border-secondary"
                           value="{{ usuario.nome if usuario else '' }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">Login</label>
                    <input type="text" name="login" class="form-control bg-dark text-white border-secondary"
                           value="{{ usuario.login if usuario else '' }}"
                           {{ 'readonly' if usuario else 'required' }}>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">E-mail</label>
                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary"
                           value="{{ usuario.email if usuario else '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">
                        Senha {% if usuario %}(deixe em branco para não alterar){% endif %}
                    </label>
                    <input type="password" name="senha" class="form-control bg-dark text-white border-secondary"
                           {{ '' if usuario else 'required' }}>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">Perfil</label>
                    <select name="perfil" class="form-select bg-dark text-white border-secondary">
                        <option value="ADMIN" {{ 'selected' if usuario and usuario.perfil == 'ADMIN' else '' }}>ADMIN</option>
                        <option value="CONSULTOR" {{ 'selected' if not usuario or usuario.perfil == 'CONSULTOR' else '' }}>CONSULTOR</option>
                        <option value="MECANICO" {{ 'selected' if usuario and usuario.perfil == 'MECANICO' else '' }}>MECÂNICO</option>
                    </select>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" name="ativo" class="form-check-input" id="ativo"
                           {{ 'checked' if not usuario or usuario.ativo else '' }}>
                    <label class="form-check-label text-secondary" for="ativo">Usuário ativo</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">Salvar</button>
                    <a href="/usuarios" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
