{% extends "base.html" %}

{% block title %}
Nova Ordem de Serviço
{% endblock %}

{% block conteudo %}

<div class="container-fluid">

    <h2 class="mb-4">
        Nova Ordem de Serviço
    </h2>

    <div class="card-dashboard">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Cliente</label>

                    <select
                        name="cliente_id"
                        class="form-control"
                        required>

                        <option value="">
                            Selecione...
                        </option>

                        {% for cliente in clientes %}

                        <option value="{{ cliente.id }}">
                            {{ cliente.nome }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Veículo</label>

                    <select
                        name="veiculo_id"
                        class="form-control"
                        required>

                        <option value="">
                            Selecione...
                        </option>

                        {% for veiculo in veiculos %}

                        <option value="{{ veiculo.id }}">
                            {{ veiculo.placa }} - {{ veiculo.modelo }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-3 mb-3">

                    <label>KM</label>

                    <input
                        type="number"
                        name="km"
                        class="form-control">

                </div>

                <div class="col-md-9 mb-3">

                    <label>Mecânico</label>

                    <input
                        type="text"
                        name="mecanico"
                        class="form-control">

                </div>

                <div class="col-12 mb-3">

                    <label>Defeito Relatado</label>

                    <textarea
                        name="defeito_relatado"
                        rows="3"
                        class="form-control"></textarea>

                </div>

                <div class="col-12 mb-3">

                    <label>Diagnóstico</label>

                    <textarea
                        name="diagnostico"
                        rows="3"
                        class="form-control"></textarea>

                </div>

                <div class="col-12 mb-3">

                    <label>Serviço Executado</label>

                    <textarea
                        name="servico_executado"
                        rows="3"
                        class="form-control"></textarea>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Valor Serviços</label>

                    <input
                        type="number"
                        step="0.01"
                        value="0"
                        name="valor_servicos"
                        class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>Valor Peças</label>

                    <input
                        type="number"
                        step="0.01"
                        value="0"
                        name="valor_pecas"
                        class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>Desconto</label>

                    <input
                        type="number"
                        step="0.01"
                        value="0"
                        name="desconto"
                        class="form-control">

                </div>

            </div>

            <button
                class="btn btn-success">

                Salvar Ordem

            </button>

            <a
                href="/ordens"
                class="btn btn-secondary">

                Cancelar

            </a>

        </form>

    </div>

</div>

{% endblock %}
