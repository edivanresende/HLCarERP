{% extends "base.html" %}

{% block title %}
Novo Veículo
{% endblock %}

{% block conteudo %}

<div class="container-fluid">

    <h2 class="mb-4 text-white">
        Novo Veículo
    </h2>

    <div class="card-dashboard">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Cliente</label>
                    <select name="cliente_id" class="form-control" required>
                        <option value="">Selecione...</option>
                        {% for cliente in clientes %}
                        <option value="{{ cliente.id }}"
                            {% if veiculo and veiculo.cliente_id == cliente.id %}selected{% endif %}>
                            {{ cliente.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Placa</label>
                    <input type="text" name="placa" class="form-control" required
                           value="{{ veiculo.placa if veiculo else '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Marca</label>
                    <input type="text" name="marca" class="form-control"
                           value="{{ veiculo.marca if veiculo else '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Modelo</label>
                    <input type="text" name="modelo" class="form-control"
                           value="{{ veiculo.modelo if veiculo else '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Cor</label>
                    <input type="text" name="cor" class="form-control"
                           value="{{ veiculo.cor if veiculo else '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label>KM</label>
                    <input type="number" name="km" class="form-control"
                           value="{{ veiculo.km if veiculo and veiculo.km else '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Chassi</label>
                    <input type="text" name="chassi" class="form-control"
                           value="{{ veiculo.chassi if veiculo else '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Motor</label>
                    <input type="text" name="motor" class="form-control"
                           value="{{ veiculo.motor if veiculo else '' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Combustível</label>
                    <select name="combustivel" class="form-control">
                        {% set comb = veiculo.combustivel if veiculo else 'Gasolina' %}
                        <option {% if comb == 'Gasolina' %}selected{% endif %}>Gasolina</option>
                        <option {% if comb == 'Etanol' %}selected{% endif %}>Etanol</option>
                        <option {% if comb == 'Flex' %}selected{% endif %}>Flex</option>
                        <option {% if comb == 'Diesel' %}selected{% endif %}>Diesel</option>
                        <option {% if comb == 'GNV' %}selected{% endif %}>GNV</option>
                        <option {% if comb == 'Elétrico' %}selected{% endif %}>Elétrico</option>
                        <option {% if comb == 'Híbrido' %}selected{% endif %}>Híbrido</option>
                    </select>
                </div>

            </div>

            <button class="btn btn-success">
                Salvar Veículo
            </button>

            <a href="/veiculos" class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
